name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests, lint, debug APK
        run: ./gradlew :core:domain:test testDebugUnitTest lintDebug assembleDebug --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: steroidtracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/"

  # SmokeTest on an emulator: opens every screen and fails on any crash (JVM and Robolectric tests
  # once missed a crash every phone hit).
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: SmokeTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: smoke-reports
          path: "app/build/reports/androidTests/"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "PT_KEYSTORE_BASE64 secret missing; refusing to publish an unsigned release"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Release APK
        env:
          PT_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          PT_KEYSTORE_PASSWORD: ${{ secrets.PT_KEYSTORE_PASSWORD }}
          PT_KEY_ALIAS: ${{ secrets.PT_KEY_ALIAS }}
          PT_KEY_PASSWORD: ${{ secrets.PT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # Settings shows the APK's versionName, so it must match the tag: v0.5.0 needs 0.5.0, v0.5.1-beta.1 needs
      # 0.5.1-beta.1 (app/build.gradle.kts).
      - name: Check version name
        run: |
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          apk=app/build/outputs/apk/release/app-release.apk
          actual="$("$aapt2" dump badging "$apk" | sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p")"
          if [ "$actual" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::$apk has versionName '$actual'; tag $GITHUB_REF_NAME needs '${GITHUB_REF_NAME#v}' (app/build.gradle.kts)"
            exit 1
          fi

      # A tag with a "-" suffix (e.g. v0.5.1-beta.1) publishes a pre-release; every other v* tag a normal release.
      # docs/releases/<tag>.md, when present, becomes the release text; otherwise GitHub lists the commits.
      # The app was renamed from ProtocolTracker: the same APK also goes out under the old name, so update tools
      # (Obtainium) with a "ProtocolTracker-.*\.apk" filter keep finding it (README › Install).
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="SteroidTracker-${GITHUB_REF_NAME}.apk"
          old_apk="ProtocolTracker-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cp app/build/outputs/apk/release/app-release.apk "$old_apk"
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          case "$GITHUB_REF_NAME" in
            *-*) set -- "$@" --prerelease ;;
          esac
          gh release create "$GITHUB_REF_NAME" "$apk" "$old_apk" --title "$GITHUB_REF_NAME" "$@"
