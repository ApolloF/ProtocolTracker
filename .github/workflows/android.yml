name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      # testDebugUnitTest and lintDebug cover both app flavors (stable and dev).
      - name: Unit tests, lint, debug APKs
        run: ./gradlew :core:domain:test testDebugUnitTest lintDebug assembleDebug --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: protocoltracker-debug-apk
          path: app/build/outputs/apk/stable/debug/*.apk

      - uses: actions/upload-artifact@v5
        with:
          name: protocoltracker-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "PT_KEYSTORE_BASE64 secret missing; refusing to publish an unsigned release"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Release APKs
        env:
          PT_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          PT_KEYSTORE_PASSWORD: ${{ secrets.PT_KEYSTORE_PASSWORD }}
          PT_KEY_ALIAS: ${{ secrets.PT_KEY_ALIAS }}
          PT_KEY_PASSWORD: ${{ secrets.PT_KEY_PASSWORD }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-dev.*) ./gradlew assembleDevRelease --stacktrace ;;
            *) ./gradlew assembleStableRelease assembleDevRelease --stacktrace ;;
          esac

      # A tag containing "-dev." (e.g. v0.5.0-dev.1) publishes only the dev APK as a pre-release; every other v* tag
      # publishes both APKs as a normal release. docs/releases/<tag>.md, when present, becomes the release text;
      # otherwise GitHub lists the commits.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dev_apk="ProtocolTracker-Dev-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/dev/release/app-dev-release.apk "$dev_apk"
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          case "$GITHUB_REF_NAME" in
            *-dev.*)
              gh release create "$GITHUB_REF_NAME" "$dev_apk" --prerelease --title "$GITHUB_REF_NAME" "$@"
              ;;
            *)
              stable_apk="ProtocolTracker-${GITHUB_REF_NAME}.apk"
              cp app/build/outputs/apk/stable/release/app-stable-release.apk "$stable_apk"
              gh release create "$GITHUB_REF_NAME" "$stable_apk" "$dev_apk" --title "$GITHUB_REF_NAME" "$@"
              ;;
          esac
