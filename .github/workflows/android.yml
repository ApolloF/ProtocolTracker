name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests, lint, debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: protocoltracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "PT_KEYSTORE_BASE64 secret missing; refusing to publish an unsigned release"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Release APK
        env:
          PT_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          PT_KEYSTORE_PASSWORD: ${{ secrets.PT_KEYSTORE_PASSWORD }}
          PT_KEY_ALIAS: ${{ secrets.PT_KEY_ALIAS }}
          PT_KEY_PASSWORD: ${{ secrets.PT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "ProtocolTracker-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "ProtocolTracker-${GITHUB_REF_NAME}.apk" --title "$GITHUB_REF_NAME" --generate-notes
